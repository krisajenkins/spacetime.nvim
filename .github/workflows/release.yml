name: Release

# Cut a GitHub release whenever a version tag is pushed. Tag the commit you want
# to release (e.g. `git tag v0.1.0 && git push origin v0.1.0`) and this takes
# care of the rest — release notes are generated from the commits since the
# previous tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
